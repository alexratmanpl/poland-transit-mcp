# Rebuild (weekly once the data-latest release exists; manual until then) of the city files whose timetable licences allow redistribution, attached to the
# "data-latest" release. Uses only the built-in GITHUB_TOKEN (no configured secrets) and never
# commits data. The build jobs, which run third-party tools on third-party data, get a read-only token;
# only the upload job, which runs no project code and no dependency, can write. The release itself is
# created once by a maintainer:
#   gh release create data-latest --prerelease --title "City data (rolling)" --notes "See DATA-LICENSE.md"
name: city-data
on:
  # enable once the data-latest release exists
  # schedule:
  #   - cron: '17 3 * * 1'   # Mondays 03:17 UTC
  workflow_dispatch:
permissions:
  contents: read
concurrency: city-data
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # warszawa: not built here yet (ZTM's re-use conditions read 2026-11-19; add it with the first data release). zakopane: map and walking only; the inputs of
        # scripts/zakopane_gtfs.py are not published and the timetable's terms are unclear.
        city: [gdansk, krakow, wroclaw, poznan, torun, lublin, katowice, zakopane]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false  # no token in .git/config while third-party data is parsed
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          python-version: "3.13"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - run: uv sync --locked  # the versions in uv.lock, exactly
      - name: Start from the published file
        # the build compares its new file with this one and refuses a worse one (exit code 3), so the upload below
        # never replaces a good file with one that lost a timetable; none is published yet on the first run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p data/cities
          if gh release download data-latest -p "${{ matrix.city }}.sqlite.gz" -D data/cities 2>/dev/null; then
            gunzip -f "data/cities/${{ matrix.city }}.sqlite.gz"
          else
            echo "no published ${{ matrix.city }}.sqlite: nothing to compare with"
          fi
      - run: uv run poland-transit-mcp build ${{ matrix.city }} --download
      - name: Check the build
        run: |
          uv run python scripts/measure.py --cities ${{ matrix.city }} --trips 50 > measure.json
          # fail on any tool error, and when a city with timetables found no transit itinerary at all
          # (for example a query date outside the feed's window); zakopane has no timetable here
          python3 - <<'EOF'
          import json, sys
          m = json.load(open("measure.json"))
          no_transit = [c for c, has in m["timetables"].items() if has and m["plan_trip_outcomes"][c]["transit"] == 0]
          print(f"dates: {m['date_queried']}; outcomes: {m['plan_trip_outcomes']}")
          if m["error_count"] or no_transit:
              print(f"::error::{m['error_count']} tool errors; timetables but no transit itinerary: {no_transit}")
              sys.exit(1)
          EOF
      - run: gzip -9 -c data/cities/${{ matrix.city }}.sqlite > ${{ matrix.city }}.sqlite.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: city-${{ matrix.city }}
          path: ${{ matrix.city }}.sqlite.gz
          if-no-files-found: error
          retention-days: 3
  # Attaches every city that built and passed its check; a city whose build failed keeps its published file.
  upload:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write  # gh release upload; this job checks out nothing and installs nothing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: city-*
          path: out
          merge-multiple: true
      - name: Attach to the data-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view data-latest > /dev/null 2>&1; then
            echo "::error::Release 'data-latest' does not exist. A maintainer creates it once (see the comment at the top of this file)."
            exit 1
          fi
          shopt -s nullglob
          files=(out/*.sqlite.gz)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no city built"
            exit 1
          fi
          gh release upload data-latest "${files[@]}" --clobber
