# Builds both packages and, when a maintainer asks, publishes them to PyPI:
#   poland-transit-mcp         the server (pure Python: one wheel and the source)
#   poland-transit-mcp-engine  the optional Rust engine (abi3 wheels for Linux, macOS, Windows, and the source)
# Nothing is published unless a maintainer starts this workflow by hand on a release tag (vX.Y.Z) with
# "publish" ticked, and approves the `pypi` environment. The tag must match the version in pyproject.toml.
# PyPI Trusted Publishing: no tokens or secrets are stored in this repository (docs/PUBLISHING.md).
name: release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload both packages to PyPI (run this on a release tag)"
        type: boolean
        default: false
  pull_request:
    paths: ["engine/**", "src/**", "pyproject.toml", "uv.lock", ".github/workflows/release.yml"]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          maturin-version: v1.16.0
          working-directory: engine
          target: ${{ matrix.target }}
          manylinux: "2014"
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: engine/dist
  macos:
    runs-on: macos-15  # Apple Silicon; the x86_64 wheel is cross-built (macos-14 images are retired)
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          maturin-version: v1.16.0
          working-directory: engine
          target: ${{ matrix.target }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: engine/dist
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          maturin-version: v1.16.0
          working-directory: engine
          target: x64
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x64
          path: engine/dist
  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          maturin-version: v1.16.0
          working-directory: engine
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: engine/dist
  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv build --sdist --wheel --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: dist/*
  # the Linux wheel, installed next to the server, must give the same answers (tests/test_engine.py)
  check:
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: wheels
      - run: uv sync --locked --extra dev
      - run: uv pip install wheels/*.whl
      - run: uv run python -c "import poland_transit_mcp.engine as e; assert e.available(), e.NAME; print(e.NAME)"
      - run: uv run pytest -q
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && startsWith(github.ref, 'refs/tags/v')
    needs: [server, linux, macos, windows, sdist, check]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write  # PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: The tag matches the server's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ls dist
          test -f "dist/poland_transit_mcp-${TAG#v}-py3-none-any.whl" || { echo "::error::no server wheel for $TAG"; exit 1; }
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          skip-existing: true  # a file PyPI already has (an earlier upload of this version) is skipped, the rest added
