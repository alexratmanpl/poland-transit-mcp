name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# --locked: the versions in uv.lock, exactly; a pyproject.toml change without a new lock fails instead of resolving
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra dev
      - run: uv run python -c "import poland_transit_mcp.engine as e; assert not e.available(); print(e.NAME)"
      - run: uv run pytest -q
  # The same tests with the optional Rust engine built from engine/ (the job above covers the
  # pure-Python fallback, which is what a plain install uses).
  test-engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          python-version: "3.13"
      # the fast extra builds the engine from engine/ (pyproject.toml: tool.uv.sources)
      - run: uv sync --locked --extra dev --extra fast
      - run: uv run python -c "import poland_transit_mcp.engine as e; assert e.available(), e.NAME; print(e.NAME)"
      - run: uv run pytest -q
  # The server adjusts SDK internals (server.py: _strict_arguments), so it pins mcp to one minor version. This job
  # runs the suite against the newest mcp 2.x: when it is green (the golden tools/list included), widen the pin.
  test-newest-sdk:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra dev
      - run: uv pip install --upgrade "mcp>=2,<3"
      - run: uv pip show mcp | grep -i '^version'
      - run: uv run --no-sync pytest -q
