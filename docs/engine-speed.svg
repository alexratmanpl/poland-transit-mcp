  <rect class="py" x="16" y="42" width="12" height="12" rx="2"/><text class="t2" x="34" y="52">Python search</text>
  <rect class="rs" x="122" y="42" width="12" height="12" rx="2"/><text class="t2" x="140" y="52">Rust engine</text>
</g>
