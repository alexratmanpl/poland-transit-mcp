<title id="t">plan_trip p95 latency: Python search vs Rust engine</title>
<desc id="d">Warszawa: Python 375 ms, Rust 118 ms; Katowice: Python 326 ms, Rust 85 ms; Kraków: Python 149 ms, Rust 65 ms; Gdańsk: Python 117 ms, Rust 44 ms. Target 300 ms.</desc>
<style>
  .bg { fill: #fcfcfb; } .t1 { fill: #0b0b0b; } .t2 { fill: #52514e; }
  .grid { stroke: #e4e3df; } .target { stroke: #52514e; }
  .py { fill: #2a78d6; } .rs { fill: #eb6834; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; } .t1 { fill: #f0efec; } .t2 { fill: #c3c2b7; }
    .grid { stroke: #33322f; } .target { stroke: #c3c2b7; }
    .py { fill: #3987e5; } .rs { fill: #d95926; }
  }
</style>
<rect class="bg" width="680" height="292" rx="8"/>
<text class="t1" x="16" y="28" font-size="15" font-weight="600">plan_trip, 95th percentile (lower is better)</text>
