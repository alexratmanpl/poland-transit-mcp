<line class="grid" x1="366.0" x2="366.0" y1="68" y2="262" stroke-width="1"/>
<text class="t2" x="366.0" y="278" font-size="11" text-anchor="middle">200 ms</text>
<line class="grid" x1="503.0" x2="503.0" y1="68" y2="262" stroke-width="1"/>
<text class="t2" x="503.0" y="278" font-size="11" text-anchor="middle">300 ms</text>
<line class="grid" x1="640.0" x2="640.0" y1="68" y2="262" stroke-width="1"/>
