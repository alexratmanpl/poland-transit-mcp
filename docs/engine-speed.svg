<text class="t1" x="84" y="93" font-size="13" text-anchor="end">Warszawa</text>
<path class="py" d="M92,74 H601.8 Q605.8,74 605.8,78 V84 Q605.8,88 601.8,88 H92 Z"/>
<path class="rs" d="M92,90 H249.7 Q253.7,90 253.7,94 V100 Q253.7,104 249.7,104 H92 Z"/>
