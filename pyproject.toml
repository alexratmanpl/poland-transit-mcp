[project]
name = "poland-transit-mcp"
version = "0.5.3"
description = "MCP server for Polish cities: places, walking routes, public transport timetables and trip planning from OpenStreetMap and official GTFS feeds. One SQLite file per city."
readme = "README.md"
license = "MIT"
authors = [{name = "alexratmanpl"}]
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "gtfs", "openstreetmap", "raptor", "public-transport", "poland"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "certifi>=2024.2.2",  # one trust store for every download (net.py)
  "mcp>=2.3,<2.4",  # server.py swaps SDK internals (_strict_arguments): widen only after its guard tests pass on the newer SDK
  "numpy>=1.26",
  "opentelemetry-api>=1.30",  # no-op unless the `otel` extra is installed and configured (telemetry.py)
  "resvg>=0.2,<0.3",  # render_map's PNG (MIT; prebuilt wheels, no dependencies); without it the map comes as SVG
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "opentelemetry-sdk>=1.30", "pillow>=10.3", "hypothesis>=6.100", "hypothesis-jsonschema>=0.23"]  # pillow: the small-png path is tested too
# send traces and metrics to an OpenTelemetry collector (docs/OBSERVABILITY.md)
otel = ["opentelemetry-sdk>=1.30", "opentelemetry-exporter-otlp-proto-http>=1.30"]
# the optional Rust search engine (engine/); without it the built-in Python search is used
fast = ["poland-transit-mcp-engine>=0.2,<0.3"]
# render_map's PNG with a 256-colour palette: about 70% fewer bytes (Pillow, MIT-CMU); without it, the PNG as drawn
small-png = ["pillow>=10.3"]

[project.urls]
Homepage = "https://github.com/alexratmanpl/poland-transit-mcp"
Repository = "https://github.com/alexratmanpl/poland-transit-mcp"
Issues = "https://github.com/alexratmanpl/poland-transit-mcp/issues"

[project.scripts]
poland-transit-mcp = "poland_transit_mcp.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poland_transit_mcp"]

# While poland-transit-mcp-engine is not on PyPI, uv takes it from engine/ (built with the Rust toolchain
# only when the `fast` extra is requested). PyPI installs ignore this; uv installs from git or a local path
# build the engine from engine/ (needs Rust).
[tool.uv.sources]
poland-transit-mcp-engine = { path = "engine" }

[tool.pytest.ini_options]
testpaths = ["tests"]
